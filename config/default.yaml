aw_recorder:
  ros__parameters:
## ============================================================================
## For recorder
## ============================================================================
    topics:  # topics to be recorded
    - ControlCommand
    - GroundtruthKinematic
    - GroundtruthSize
    - EstimatedKinematic
    - AWSIMMetadata
    - PerceptionObject
    - BoundingBoxPerceptionObject
    - PlanningTrajectory
    - CameraFootage

## ============================================================================
## For perception monitoring and shielding
## ============================================================================
    # 1. if perception_monitor is false, disable monitoring and shielding
    # 2. if perception_monitor is true:
    #  2.1. if perception_shield is false, only monitoring, but not modify perception outputs
    #  2.2. if perception_shield is true, both monitoring and shielding (modifying perception outputs)
    perception_monitor: true
    perception_shield: false
    # perception_spec: '[](x.(forall id@x. ((present(x+1, id)) -> present(x+2, id) )))'
    # perception_spec: >
    #     [](x.(forall id@x. (
    #                 (P(x,id) >= 0.3
    #                     && dist_ego(x,id) < 50 && angle_ego(x,id) > -60 && angle_ego(x,id) < 60 
    #                     && present(x+1, id)) 
    #                 -> (present(x+2, id) || exists id2@(x+2). (dist_est(x+2,id2,x+1,id,x+2) < 0.5)) 
    #         )))
    perception_spec: 'true'
    window_size: 3
    # Don't activate the shield if the ego speed is below this threshold
    speed_threshold_perp_shield_activation: 3.0 # m/s
    max_prediction_frames: 3

## ============================================================================
## For planning shield
## ============================================================================
    # 1. if planning_monitor is false, disable monitoring and shielding
    # 2. if planning_monitor is true:
    #  2.1. if planning_shield is false, only monitoring, but not modify trajectories
    #  2.2. if planning_shield is true, both monitoring and shielding (modifying trajectories)
    planning_monitor: true
    planning_shield: false
    # planning_safety_spec: '[] (pathConfidence >= 0.1 /\ time <= 3.0 -> ~ collision)'
    planning_safety_spec: 'True'
    spec_syntax_file_path: 'formal_spec/syntax.maude'
    
    # Don't activate the shield if the ego speed is below this threshold
    speed_threshold_activation: 3.0 # m/s
    # ignore the planning points behind this time bound
    time_bound: 10.0  # seconds
    # Ignore perceived object if its distance to ego always greater than this threshold in all planning points
    distance_bound: 80.0  # meters
    # unsafe_confirmation_frames: 2

    ## TrajectoryReviser config.
    ## To disable a revision option, comment it
    ## Deceleration Profiles
    # Each profile defines a level of deceleration intensity
    # target_speed_ratio: 0.0 = full stop, 0.3 = reduce to 30% of current speed
    # max_decel_ratio: ratio of ego_min_accel to use (0.4 = 40%, 1.0 = 100%)
    # max_jerk_ratio: ratio of ego_min_jerk to use (0.4 = 40%, 1.0 = 100%)
    # weight: lower values are tried first
    revision_deceleration_profiles:
        names: ["gentle_stop", "moderate_stop", "aggressive_stop"]
        target_speed_ratios: [0.0, 0.0, 0.0]
        max_decel_ratios: [0.5, 0.75, 1.0]
        max_jerk_ratios: [0.5, 0.75, 1.0]
        weights: [1.0, 2.0, 3.0]
    
    ## Lateral shift parameters
    revision_lateral_shift:
        offsets: [0.5, 1.0, 1.5]
        weight_base: 5.0
        weight_factor: 3.0
    
    # ## Combined correction parameters (deceleration + lateral shift)
    revision_combined:
        # Deceleration profiles to combine
        decel_profiles:
            names: ["moderate_stop", "aggressive_stop"]
            target_speed_ratios: [0.0, 0.0]
            max_decel_ratios: [0.75, 1.0]
            max_jerk_ratios: [0.75, 1.0]
            weights: [2.0, 3.0]
        # Lateral offsets for combined corrections (in meters)
        lateral_offsets: [0.5, 1.0]
        # Weight parameters for combined corrections
        weight_base: 10.0
        weight_factor: 2.0

    revision_smoothing_iterations: 5
    revision_smoothing_weight: 0.3
    revision_max_curvature: 1.0
    revision_max_candidates: 50
    revision_min_points: 30

    ## others
    # planning_trajectory_topic: '/planning/scenario_planning/trajectory'  # the topic name differs in different versions of Autoware
    # planning_trajectory_topic: '/planning/trajectory'

